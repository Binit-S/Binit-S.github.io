  <script>
    // Fetch and load logs on initialization
    async function loadLogsIndex() {
      if (window.location.protocol === 'file:') {
        document.getElementById('logs-container').innerHTML = `
          <div class="logs-error" style="color: #FF4721; font-family: 'Ubuntu Mono', monospace; line-height: 1.6; font-size: 1.1rem; margin-top: 20px;">
            <strong>[Local Protocol Notice]</strong><br>
            Your browser's security settings (CORS same-origin policy) block loading local JSON/Markdown files directly via <code>file://</code>.<br><br>
            To preview and test your blog layout locally:
            <ol style="margin-left: 20px; margin-top: 10px; padding-left: 10px;">
              <li>Run a local web server in your terminal (e.g., Python's <code>python -m http.server</code>, or Node's <code>npx http-server</code>).</li>
              <li>Access the site in your browser at <code>http://localhost:8000/archive.html</code> (or the port your server outputs).</li>
            </ol>
          </div>
        `;
        return;
      }
      try {
        const response = await fetch('posts/index.json');
        if (!response.ok) throw new Error('Failed to fetch posts registry');
        const posts = await response.json();
        
        // Group by monthYear
        const groups = {};
        posts.forEach(post => {
          if (!groups[post.monthYear]) {
            groups[post.monthYear] = [];
          }
          groups[post.monthYear].push(post);
        });

        const logsContainer = document.getElementById('logs-container');
        logsContainer.innerHTML = '';

        for (const [monthYear, items] of Object.entries(groups)) {
          const groupEl = document.createElement('div');
          groupEl.className = 'logs-group';
          
          let groupHtml = '';
          items.forEach((item, index) => {
            groupHtml += `
              <div class="log-row">
                <div class="log-month-year">${index === 0 ? monthYear : ''}</div>
                <a href="post.html?id=${item.id}" class="log-title">${item.title}</a>
              </div>
            `;
          });
          groupEl.innerHTML = groupHtml;
          logsContainer.appendChild(groupEl);
        }

        // Re-bind mouse events for custom cursor on newly loaded dynamic links
        const newInteractables = document.querySelectorAll('.log-title');
        newInteractables.forEach((el) => {
          el.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
          el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });

      } catch (err) {
        console.error('Error rendering logs:', err);
        document.getElementById('logs-container').innerHTML = `
          <div class="logs-error">Error loading logs archive. Please check index.json.</div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadLogsIndex);
  </script>

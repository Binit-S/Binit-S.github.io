<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive // Binit S.</title>
  <link rel="icon" type="image/x-icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jersey+20&family=Kaushan+Script&family=JetBrains+Mono:wght@400;500;700&family=Ubuntu+Condensed&family=Ubuntu+Mono:wght@400;700&family=Special+Gothic+Condensed+One&display=swap"
    rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="blog-theme">

  <div class="noise-overlay"></div>

  <!-- Minimal Navbar -->
  <nav class="navbar scrolled" id="navbar" style="opacity: 1;">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">BINIT.S_</a>
      <div class="nav-links">
        <a href="index.html#projects">WORK</a>
        <a href="index.html#proof">STACK</a>
        <a href="archive.html" class="active">ARCHIVE</a>
        <a href="index.html#contact">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- ── MAIN SPLIT CONTAINER ── -->
  <main class="archive-split-layout">
    <!-- Left Column -->
    <div class="archive-col-left">
      <div class="archive-hero-block">
        <h1 class="archive-main-heading">ARCHIVE</h1>
        <div class="archive-heading-underline"></div>
        <div class="archive-desc-wrap">
          <p class="archive-desc">AN ARCHIVE OF LEARNING , BUILDING AND SHIPPING SYSTEMS</p>
        </div>
      </div>
    </div>

    <!-- Center vertical line -->
    <div class="archive-divider-line"></div>

    <!-- Right Column -->
    <div class="archive-col-right">
      <h2 class="logs-header">LOGS</h2>
      <div class="logs-container" id="logs-container">
        <!-- Dynmically loaded posts list -->
        <div class="logs-loading">Loading logs...</div>
      </div>
      
      <!-- Bottom right active text -->
      <div class="archive-footer-text">
        &gt; writing code <span class="blink-dot">...</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    // Fetch and load logs on initialization
    async function loadLogsIndex() {
      if (window.location.protocol === 'file:') {
        document.getElementById('logs-container').innerHTML = `
          <div class="logs-error" style="color: #FF4721; font-family: 'Ubuntu Mono', monospace; line-height: 1.6; font-size: 1.1rem; margin-top: 20px;">
            <strong>[Local Protocol Notice]</strong><br>
            Your browser's security settings (CORS same-origin policy) block loading local JSON/Markdown files directly via <code>file://</code>.<br><br>
            To preview and test your blog layout locally:
            <ol style="margin-left: 20px; margin-top: 10px; padding-left: 10px;">
              <li>Run a local web server in your terminal (e.g., Python's <code>python -m http.server</code>, or Node's <code>npx http-server</code>).</li>
              <li>Access the site in your browser at <code>http://localhost:8000/archive.html</code> (or the port your server outputs).</li>
            </ol>
          </div>
        `;
        return;
      }
      try {
        const response = await fetch('posts/index.json');
        if (!response.ok) throw new Error('Failed to fetch posts registry');
        const posts = await response.json();
        
        // Group by monthYear
        const groups = {};
        posts.forEach(post => {
          if (!groups[post.monthYear]) {
            groups[post.monthYear] = [];
          }
          groups[post.monthYear].push(post);
        });

        const logsContainer = document.getElementById('logs-container');
        logsContainer.innerHTML = '';

        for (const [monthYear, items] of Object.entries(groups)) {
          const groupEl = document.createElement('div');
          groupEl.className = 'logs-group';
          
          let groupHtml = '';
          items.forEach((item, index) => {
            groupHtml += `
              <div class="log-row">
                <div class="log-month-year">${index === 0 ? monthYear : ''}</div>
                <a href="post.html?id=${item.id}" class="log-title">${item.title}</a>
              </div>
            `;
          });
          groupEl.innerHTML = groupHtml;
          logsContainer.appendChild(groupEl);
        }

      } catch (err) {
        console.error('Error rendering logs:', err);
        document.getElementById('logs-container').innerHTML = `
          <div class="logs-error">Error loading logs archive. Please check index.json.</div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadLogsIndex);
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog // Binit S.</title>
  <link rel="icon" type="image/x-icon" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jersey+20&family=Kaushan+Script&family=JetBrains+Mono:wght@400;500;700&family=Ubuntu+Condensed&family=Ubuntu+Mono:wght@400;700&family=Special+Gothic+Condensed+One&display=swap"
    rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
  <!-- Prism.js Tomorrow Night Theme for Code Blocks -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="blog-theme">

  <div class="noise-overlay"></div>

  <!-- Minimal Navbar -->
  <nav class="navbar scrolled" id="navbar" style="opacity: 1;">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">BINIT.S_</a>
      <div class="nav-links">
        <a href="index.html#projects">WORK</a>
        <a href="index.html#proof">STACK</a>
        <a href="archive.html" class="active">ARCHIVE</a>
        <a href="index.html#contact">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- ── SINGLE POST WRAPPER ── -->
  <div class="blog-post-layout">
    <!-- Top-left logs back navigaton -->
    <div class="blog-back-btn-container">
      <a href="archive.html" class="blog-back-btn">
        <span class="back-arrow">↖</span> LOGS
      </a>
    </div>

    <!-- Article Header -->
    <header class="blog-post-header">
      <h1 class="blog-post-title" id="post-title">Loading post...</h1>
      <div class="blog-post-date" id="post-date"></div>
    </header>

    <!-- Rendered Markdown Body -->
    <article class="blog-post-body" id="post-body">
      <div class="blog-body-loading">Fetching markdown content...</div>
    </article>

    <!-- Specialized Blog Footer -->
    <footer class="post-footer">
      <div class="post-signature">~written by Binit</div>
      <div class="post-footer-line"></div>
    </footer>
  </div>

  <!-- marked library for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism JS for syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <!-- Prism JS Language Auto-Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <script src="script.js"></script>
  <script>
    async function loadBlogPost() {
      if (window.location.protocol === 'file:') {
        document.getElementById('post-title').textContent = 'LOCAL PREVIEW LIMITATION';
        document.getElementById('post-date').textContent = '';
        document.getElementById('post-body').innerHTML = `
          <div class="blog-error" style="color: #FF4721; font-family: 'Ubuntu Mono', monospace; line-height: 1.6; font-size: 1.1rem; padding: 20px 0;">
            <strong>[Local Protocol Notice]</strong><br>
            Your browser's security settings block loading local Markdown files dynamically via the <code>file://</code> protocol.<br><br>
            To test your markdown files and edits locally:
            <ol style="margin-left: 20px; margin-top: 10px; padding-left: 10px;">
              <li>Run a local web server (e.g., VS Code's "Live Server" extension, Python's <code>python -m http.server</code>, or <code>npx http-server</code> inside this folder).</li>
              <li>View this page via <code>http://localhost:your-port/post.html?id=my-first-post</code> in your browser.</li>
            </ol>
          </div>
        `;
        return;
      }
      try {
        const postId = new URLSearchParams(window.location.search).get('id');
        if (!postId) throw new Error('No post ID specified in URL');

        // 1. Fetch metadata first to get correct title and date
        const indexResponse = await fetch('posts/index.json');
        if (!indexResponse.ok) throw new Error('Failed to load posts index');
        const postsIndex = await indexResponse.json();
        
        const postMeta = postsIndex.find(p => p.id === postId);
        if (postMeta) {
          document.getElementById('post-title').textContent = postMeta.title;
          document.getElementById('post-date').textContent = postMeta.date;
          document.title = `${postMeta.title} // Binit S.`;
        } else {
          // Fallback if not registered
          document.getElementById('post-title').textContent = postId.replace(/-/g, ' ').toUpperCase();
          document.getElementById('post-date').textContent = '';
        }

        // 2. Fetch the markdown file content
        const markdownResponse = await fetch(`posts/${postId}.md`);
        if (!markdownResponse.ok) throw new Error('Blog post markdown file not found');
        const markdownText = await markdownResponse.text();

        // 3. Render markdown to HTML
        const bodyEl = document.getElementById('post-body');
        bodyEl.innerHTML = marked.parse(markdownText);

        // 4. Force Prism to highlight all newly injected code blocks
        Prism.highlightAll();

      } catch (err) {
        console.error('Error loading blog post:', err);
        document.getElementById('post-title').textContent = 'ERROR 404';
        document.getElementById('post-date').textContent = '';
        document.getElementById('post-body').innerHTML = `
          <div class="blog-error">
            <p>Could not load the requested blog post.</p>
            <a href="archive.html" class="blog-error-back">&lt; Back to Archive</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadBlogPost);
  </script>
</body>

</html>

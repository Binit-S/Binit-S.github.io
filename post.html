  <script src="script.js"></script>
  <script>
    async function loadBlogPost() {
      try {
        const postId = new URLSearchParams(window.location.search).get('id');
        if (!postId) throw new Error('No post ID specified in URL');

        // 1. Fetch metadata first to get correct title and date
        const indexResponse = await fetch('posts/index.json');
        if (!indexResponse.ok) throw new Error('Failed to load posts index');
        const postsIndex = await indexResponse.json();
        
        const postMeta = postsIndex.find(p => p.id === postId);
        if (postMeta) {
          document.getElementById('post-title').textContent = postMeta.title;
          document.getElementById('post-date').textContent = postMeta.date;
          document.title = `${postMeta.title} // Binit S.`;
        } else {
          // Fallback if not registered
          document.getElementById('post-title').textContent = postId.replace(/-/g, ' ').toUpperCase();
          document.getElementById('post-date').textContent = '';
        }

        // 2. Fetch the markdown file content
        const markdownResponse = await fetch(`posts/${postId}.md`);
        if (!markdownResponse.ok) throw new Error('Blog post markdown file not found');
        const markdownText = await markdownResponse.text();

        // 3. Render markdown to HTML
        const bodyEl = document.getElementById('post-body');
        bodyEl.innerHTML = marked.parse(markdownText);

        // 4. Force Prism to highlight all newly injected code blocks
        Prism.highlightAll();

        // Re-bind mouse events for custom cursor on newly rendered links
        const blogLinks = bodyEl.querySelectorAll('a');
        blogLinks.forEach(link => {
          link.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
          link.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
        });

      } catch (err) {
        console.error('Error loading blog post:', err);
        document.getElementById('post-title').textContent = 'ERROR 404';
        document.getElementById('post-date').textContent = '';
        document.getElementById('post-body').innerHTML = `
          <div class="blog-error">
            <p>Could not load the requested blog post.</p>
            <a href="archive.html" class="blog-error-back">&lt; Back to Archive</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadBlogPost);
  </script>
